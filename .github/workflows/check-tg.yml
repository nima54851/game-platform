name: Quick Telegram Check

on:
  push:
    paths:
      - phone-lookup/bot.py
      - phone-lookup/poll_check.py
      - phone-lookup/test_msg.py
      - .github/workflows/check-tg.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          cd phone-lookup
          pip install python-telegram-bot flask requests --break-system-packages -q

      - name: Send test message
        env:
          BOT_TOKEN: "8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU"
        run: |
          cd phone-lookup
          BOT_TOKEN="$BOT_TOKEN" python3 test_msg.py 2>&1

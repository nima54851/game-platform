name: Telegram Bot Runner

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Bot Token'
        required: true
        type: string
        default: '8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            phone-lookup
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          cd phone-lookup
          pip install python-telegram-bot flask requests --break-system-packages -q

      - name: Verify DB
        run: |
          cd phone-lookup
          python3 -c "from phone_data import get_db_stats; s = get_db_stats(); print('DB entries: ' + str(s['total_7digit']))"

      - name: Test Telegram
        run: |
          cd phone-lookup
          python3 -c "import requests; r = requests.get('https://api.telegram.org/bot${{ github.event.inputs.bot_token }}/getMe', timeout=15); print('TG:', r.json())"

      - name: Run bot
        run: |
          cd phone-lookup
          echo "Bot starting..."
          BOT_TOKEN="${{ github.event.inputs.bot_token }}" python3 bot.py &
          echo "PID: $!"
          sleep 21600

name: Phone Lookup Bot

on:
  push:
    paths:
      - phone-lookup/**

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          cd phone-lookup
          pip install python-telegram-bot flask requests --break-system-packages -q

      - name: Verify DB
        run: |
          cd phone-lookup
          python3 -c "from phone_data import get_db_stats; s = get_db_stats(); print('DB entries: ' + str(s['total_7digit']))"

      - name: Test Telegram
        run: |
          cd phone-lookup
          python3 -c "import requests; r = requests.get('https://api.telegram.org/bot8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU/getMe', timeout=15); print('TG:', r.json())"

      - name: Debug token
        run: |
          echo "BOT_TOKEN is: $BOT_TOKEN"
          echo "BOT_TOKEN len: ${#BOT_TOKEN}"

      - name: Run bot
        env:
          BOT_TOKEN: 8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU
        run: |
          cd phone-lookup
          echo "BOT_TOKEN=$BOT_TOKEN"
          python3 bot.py &
          sleep 5
          ps aux | grep bot.py | grep -v grep || echo 'bot.py not running'
          sleep 21595

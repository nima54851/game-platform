name: Run Phone Lookup Bot

on:
  push:
    paths:
      - phone-lookup/
      - .github/workflows/phone-lookup.yml
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            phone-lookup
            .github/workflows/phone-lookup.yml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd phone-lookup
          pip install python-telegram-bot flask requests --break-system-packages -q

      - name: Verify database
        run: |
          cd phone-lookup
          python3 -c "from phone_data import get_db_stats; s = get_db_stats(); print('DB OK: ' + str(s['total_7digit']) + ' entries')"

      - name: Test Telegram connectivity
        run: |
          cd phone-lookup
          python3 -c "
import os, requests
token = os.environ.get('BOT_TOKEN', '8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU')
r = requests.get(f'https://api.telegram.org/bot{token}/getMe', timeout=15)
data = r.json()
print('Telegram getMe:', data)
if data.get('ok'):
    print('BOT USERNAME:', data['result']['username'])
    print('BOT NAME:', data['result']['first_name'])
"

      - name: Start bot
        run: |
          cd phone-lookup
          export BOT_TOKEN="8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU"
          echo "Starting bot..."
          python3 bot.py &
          echo "Bot PID: $!"
          sleep 21600

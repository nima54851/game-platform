name: Run Phone Lookup Bot

on:
  push:
    paths:
      - 'phone-lookup/**'
      - '.github/workflows/phone-lookup.yml'
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Telegram Bot Token'
        required: true
        type: string

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            phone-lookup
            .github/workflows/phone-lookup.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          cd phone-lookup
          pip install python-telegram-bot flask --break-system-packages -q

      - name: Verify DB
        run: |
          cd phone-lookup
          python3 -c "from phone_data import get_db_stats; s=get_db_stats(); print(f'DB: {s[\'total_7digit\']} entries')"

      - name: Run bot
        env:
          BOT_TOKEN: \${{ github.event.inputs.bot_token || '8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU' }}
        run: |
          cd phone-lookup
          echo "🤖 Bot starting..."
          python3 bot.py &
          echo "Bot PID: $!"
          # Keep alive for 6 hours
          sleep 21600

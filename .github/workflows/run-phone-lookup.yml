name: Run Phone Lookup Bot

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Telegram Bot Token'
        required: true
        type: string

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          path: phone-lookup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          working-directory: phone-lookup

      - name: Install
        run: pip install python-telegram-bot flask --break-system-packages -q
        working-directory: phone-lookup

      - name: Verify DB
        run: python3 -c "from phone_data import get_db_stats; s=get_db_stats(); print(f'DB: {s[\'total_7digit\']} entries')"
        working-directory: phone-lookup

      - name: Run bot
        run: |
          echo "🤖 Bot starting..."
          BOT_TOKEN="${{ github.event.inputs.bot_token }}" python3 bot.py &
          echo "Bot running, keeping alive..."
          sleep 21600
        working-directory: phone-lookup

name: Test Telegram Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            phone-lookup
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests python-telegram-bot --break-system-packages -q

      - name: Test bot polling + getUpdates
        run: |
          cd phone-lookup
          python3 -c "
import os, asyncio, sys
sys.path.insert(0, '.')
os.environ['BOT_TOKEN'] = '8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU'

import telegram.ext
from telegram.ext import Application

async def test():
    app = Application.builder().token(os.environ['BOT_TOKEN']).build()
    await app.initialize()
    me = await app.bot.get_me()
    print('Bot: @' + me.username)
    # Try to get any pending updates (short timeout)
    try:
        updates = await app.bot.get_updates(timeout=5, read_timeout=5, write_timeout=5)
        print('Pending updates:', len(updates))
        for u in updates:
            print('  - update_id:', u.update_id, 'msg:', u.message.text if u.message else 'callback')
    except Exception as e:
        print('get_updates error:', type(e).__name__, str(e)[:200])
    await app.shutdown()

asyncio.run(test())
" 2>&1

      - name: Show recent workflow runs for context
        run: echo "Current run time: $(date -u)"

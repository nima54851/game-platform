name: Bot

on:
  push:
    paths:
      - phone-lookup/**

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd phone-lookup
          pip install python-telegram-bot flask requests --break-system-packages -q
      - env:
          BOT_TOKEN: "8979991426:AAEtgWjhF1KV_pJZVwzjk-ZE2_Yf1-W4RDU"
        run: |
          cd phone-lookup
          nohup python3 bot.py > bot.log 2>&1 &
          echo "PID: $!"
          sleep 21600
